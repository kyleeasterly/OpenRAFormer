# Pareto-frontier probe: 6 models from the price ladder in one FFA, identical
# prompt/scaffold, full turn speed. Cost per player tracked live via
# usage.estimated_cost; performance = survival/placement + army/econ stats.
name: pareto-ffa
map: scorched-earth.oramap
web: { port: 5199 }
display: ":97"
resolution: [2540, 2540]
stream: { fps: 6, scale: 2048, quality: 6 }
turnIntervalSeconds: 0
maxTurnsPerPlayer: 0
players:
  - { slug: p1, display: Llama-1B,     provider: deepinfra, model: meta-llama/Llama-3.2-1B-Instruct,          faction: Random, spawn: 0, team: 0, temperature: 0.6 }
  - { slug: p2, display: Llama-8B,     provider: deepinfra, model: meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo, faction: Random, spawn: 0, team: 0, temperature: 0.6 }
  - { slug: p3, display: Gemma4-E4B,   provider: deepinfra, model: google/gemma-4-E4B-it,                     faction: Random, spawn: 0, team: 0, temperature: 0.6 }
  - { slug: p4, display: GPT-OSS-20B,  provider: deepinfra, model: openai/gpt-oss-20b,                        faction: Random, spawn: 0, team: 0, temperature: 0.6 }
  - { slug: p5, display: GPT-OSS-120B, provider: deepinfra, model: openai/gpt-oss-120b,                       faction: Random, spawn: 0, team: 0, temperature: 0.6 }
  - { slug: p6, display: Gemma4-26B,   provider: deepinfra, model: google/gemma-4-26B-A4B-it,                 faction: Random, spawn: 0, team: 0, temperature: 0.6 }
providers:
  deepinfra: { baseUrl: "https://api.deepinfra.com/v1/openai", apiKeyEnv: DEEPINFRA_API_KEY }
  nous:      { baseUrl: "https://inference-api.nousresearch.com/v1", apiKeyEnv: NOUS_API_KEY }
  test:      { baseUrl: "", apiKeyEnv: "" }
