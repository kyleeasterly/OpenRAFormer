# Narrowed field (2026-08-09): the survivors of the pareto-ffa rounds — two-time
# champion Llama-1B plus both GPT-OSS models (best macro, cheapest, one shared
# instruction dialect). 2× each for a 6-player FFA. Cut for now: Llama-8B,
# Gemma4-E4B, Gemma4-26B (capability-per-dollar, see 2026-08-09 journal).
name: narrow-ffa
map: scorched-earth.oramap
web: { port: 5199 }
display: ":97"
resolution: [2540, 2540]
stream: { fps: 6, scale: 2048, quality: 6 }
turnIntervalSeconds: 0
maxTurnsPerPlayer: 0
players:
  - { slug: p1, display: Llama-1B-A,     provider: deepinfra, model: meta-llama/Llama-3.2-1B-Instruct, faction: Random, spawn: 0, team: 0, temperature: 0.6 }
  - { slug: p2, display: Llama-1B-B,     provider: deepinfra, model: meta-llama/Llama-3.2-1B-Instruct, faction: Random, spawn: 0, team: 0, temperature: 0.6 }
  - { slug: p3, display: GPT-OSS-20B-A,  provider: deepinfra, model: openai/gpt-oss-20b,               faction: Random, spawn: 0, team: 0, temperature: 0.6 }
  - { slug: p4, display: GPT-OSS-20B-B,  provider: deepinfra, model: openai/gpt-oss-20b,               faction: Random, spawn: 0, team: 0, temperature: 0.6 }
  - { slug: p5, display: GPT-OSS-120B-A, provider: deepinfra, model: openai/gpt-oss-120b,              faction: Random, spawn: 0, team: 0, temperature: 0.6 }
  - { slug: p6, display: GPT-OSS-120B-B, provider: deepinfra, model: openai/gpt-oss-120b,              faction: Random, spawn: 0, team: 0, temperature: 0.6 }
providers:
  deepinfra: { baseUrl: "https://api.deepinfra.com/v1/openai", apiKeyEnv: DEEPINFRA_API_KEY }
  nous:      { baseUrl: "https://inference-api.nousresearch.com/v1", apiKeyEnv: NOUS_API_KEY }
  test:      { baseUrl: "", apiKeyEnv: "" }
