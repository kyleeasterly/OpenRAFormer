<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orf observer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden; font-family: system-ui, sans-serif; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; gap: 14px;
    align-items: center; padding: 6px 12px; color: #ddd; font-size: 13px;
    background: linear-gradient(#000c, #0000); pointer-events: none;
  }
  #hud a { color: #7ab8f5; text-decoration: none; pointer-events: auto; }
  #hud .mono { font-family: ui-monospace, monospace; }
  #legend { display: flex; gap: 10px; flex-wrap: wrap; }
  #legend span { display: inline-flex; align-items: center; gap: 4px; }
  #legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  #legend .dead { text-decoration: line-through; opacity: .5; }
  #err {
    position: fixed; inset: 40% 20%; color: #f88; text-align: center; z-index: 20;
    font-size: 14px; display: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="hud">
  <a href="index.html">← dashboard</a>
  <span id="clock" class="mono">--:--</span>
  <span id="legend"></span>
  <span style="margin-left:auto; color:#666" id="stats" class="mono"></span>
</div>
<div id="err"></div>
<script src="pixi.min.js"></script>
<script src="observer.js"></script>
</body>
</html>
